services:
  gnuhealth-db:
    image: postgres:16-alpine
    container_name: qimed-gnuhealth-db
    restart: always
    environment:
      - POSTGRES_USER=gnuhealth
      - POSTGRES_PASSWORD=gnuhealth
      - POSTGRES_DB=gnuhealth
    ports:
      - "5434:5432"
    volumes:
      - gnuhealth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnuhealth -d gnuhealth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - qimed-network

  gnuhealth-server:
    build:
      context: .
      dockerfile: docker/gnuhealth/Dockerfile
    container_name: qimed-gnuhealth-server
    restart: always
    depends_on:
      gnuhealth-db:
        condition: service_healthy
    environment:
      - TRYTON_ADMIN_PASSWORD=admin
      - TRYTON_DB_NAME=gnuhealth
    ports:
      - "8001:8000"
    volumes:
      - gnuhealth-data:/var/lib/trytond
      - ./config/gnuhealth/trytond.conf:/etc/trytond.conf:ro
      - ./data:/app/data
      - ./src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qimed-network

volumes:
  gnuhealth-postgres-data:
  gnuhealth-data:

networks:
  qimed-network:
    name: qimed_pipeline_qimed-network
    external: true
